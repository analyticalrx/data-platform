spring.application.name=dataplatform

# Local development uses the SSM tunnel on localhost:5433. Deployed profiles
# should provide these values from the database secret/configuration provider.
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://127.0.0.1:5433/analyticalrx?sslmode=require}
spring.datasource.username=${DB_USERNAME:analyticalrx_data_platform_password_rw}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none


app.jwt.secret=${JWT_SIGNING_SECRET}
app.jwt.expiration-ms=${JWT_ACCESS_TOKEN_TTL_MS:1800000}
app.jwt.issuer=${JWT_ISSUER:analyticalrx-api}
app.jwt.audience=${JWT_AUDIENCE:analyticalrx-frontend}

management.endpoints.web.exposure.include=health,info
